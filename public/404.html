<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d17">
  <title>Page introuvable — Esteban Bueno</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:radial-gradient(ellipse at 50% 35%,rgba(59,137,133,.16),transparent 35rem),#080d17}
    .error-card{width:min(100%,620px);padding:clamp(28px,6vw,58px);border:1px solid rgba(115,224,206,.22);border-radius:14px;background:linear-gradient(145deg,#142432,#0d1724);text-align:center}
    .error-code{color:#73e0ce;font:500 .75rem "IBM Plex Mono",monospace;letter-spacing:.16em}
    .error-card h1{margin:22px 0 14px;font-size:clamp(3.5rem,12vw,6rem);letter-spacing:-.08em}
    .error-card p{max-width:410px;margin:0 auto;color:#9aabb8;font-size:.94rem}
    .error-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}
    .error-brand{display:inline-block;margin-bottom:35px;color:#edf5f6;font:600 .9rem "IBM Plex Mono",monospace}
    .error-brand span{color:#73e0ce}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <a class="error-brand" href="/">est1<span>.dev</span></a>
      <p class="error-code">ERREUR 404 / PAGE INTROUVABLE</p>
      <h1>Perdu<span class="hero-period">.</span></h1>
      <p>Cette adresse ne mène à aucune page. Le lien a peut-être changé ou l'URL contient une erreur.</p>
      <div class="error-actions">
        <a class="button button-primary" href="/">Retour à l'accueil <span aria-hidden="true">↗</span></a>
        <a class="button button-ghost" href="/#projets">Voir les projets</a>
      </div>
    </section>
  </main>
</body>
</html>
